<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena – iÚčetní</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root{--bg:#fbf8fb;--text:#1d1422;--muted:#6b5f70;--plum:#6e0a63}
@media (prefers-color-scheme: dark){:root{--bg:#140d18;--text:#f4eef6;--muted:#b4a7ba;--plum:#e48ad8}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px}
img{width:64px;height:64px}
h1{font-size:2rem;margin:16px 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 24px}
a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--plum);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<img src="/img/logo.png" alt="">
<h1>Tuhle stránku jsme nenašli</h1>
<p>Odkaz je možná zastaralý nebo v něm je překlep.</p>
<a href="/">Zpět na úvod</a>
</main>
</body>
</html>
